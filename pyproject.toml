[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rkformat"
version = "0.1.0"
description = "The .rkf compound document: Markdown with its images embedded in a single shareable file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rajat Kumar", email = "rajatk0506@gmail.com" }]
keywords = ["markdown", "document", "container", "images", "file-format"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["markdown-it-py>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rk = "rkformat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The browser modules `rk share` inlines into a self-viewing HTML. Generated from
# docs/assets by docs/build.py.
[tool.setuptools.package-data]
rkformat = ["web/*.js", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
